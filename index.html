<style id="css">
/* Layout: supply catalogue — sticky header with search, scrollable category rail, dense 2-up product grid; the cart opens as a side sheet; products come from a Google Sheet */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E5ECE8; --ink:#16201D; --muted:#55645E; --line:#D3DCD7;
  --accent:#2C5C3C; --accent-hover:#224A30; --accent-ink:#FFFFFF; --accent-soft:#E1EDE3; --wood:#8A5F35;
  --ok:#2B7A4C; --warn:#94590A; --danger:#B3261E; --scrim:rgba(12,20,18,.5);
  --wa:#1E8C4C; --wa-ink:#FFFFFF;
  --solid:#2C5C3C; --solid-hover:#224A30; --solid-ink:#FFFFFF; --okfill:#2B7A4C;
  --pick-bg:#16201D; --pick-ink:#F2F5F3; --pick-line:#16201D; --tab-on:#FFFFFF;
  --c-resto:#A3264B; --c-endo:#1D6A86; --c-bur:#4E54A6; --c-imp:#257564; --c-disp:#80611A; --c-kit:#72388D;
  /* physical colours: product photo ground, shade tabs, ISO file handles, bur grit rings (same in both themes) */
  --photo-bg:#FFFFFF;
  --mark-filter:brightness(.6); --mark-dim:.6;
  --sh-A1:#F3E8D3; --sh-A2:#EEDDBE; --sh-A3:#E6D0A6; --sh-A35:#DCC292; --sh-A4:#CEAF7C;
  --sh-B1:#F6EEDC; --sh-B2:#ECDFBF; --sh-B3:#E1CD9E; --sh-C1:#E4DBC6; --sh-C2:#D8CCB0; --sh-D2:#E2D6BF;
  --tab-edge:rgba(70,52,28,.28); --tab-shade:rgba(120,88,40,.2);
  --iso-15:#FFFFFF; --iso-20:#F2C230; --iso-25:#D2332E; --iso-30:#2457B8; --iso-35:#2E8B4A; --iso-40:#1C1C1C;
  --grit-c:#2E8B4A; --grit-m:#2457B8; --grit-f:#D2332E;
  /* Physical colours stored inverted and flipped back with filter:invert(1). Forced-dark browsers
     (Samsung Internet) leave dark colours alone, so these survive their repainting. */
  --sh-A1-inv:#0C172C;
  --sh-A2-inv:#112241;
  --sh-A3-inv:#192F59;
  --sh-A35-inv:#233D6D;
  --sh-A4-inv:#315083;
  --sh-B1-inv:#091123;
  --sh-B2-inv:#132040;
  --sh-B3-inv:#1E3261;
  --sh-C1-inv:#1B2439;
  --sh-C2-inv:#27334F;
  --sh-D2-inv:#1D2940;
  --iso-15-inv:#000000;
  --iso-20-inv:#0D3DCF;
  --iso-25-inv:#2DCCD1;
  --iso-30-inv:#DBA847;
  --iso-35-inv:#D174B5;
  --iso-40-inv:#E3E3E3;
  --grit-c-inv:#D174B5;
  --grit-m-inv:#DBA847;
  --grit-f-inv:#2DCCD1;
  --tab-shade-inv:rgba(135,167,215,.2); --tab-edge-inv:rgba(185,203,227,.28); --line-inv:#2C2328;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-arabic:"Reem Kufi","Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
  --f-arabic-text:"Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,serif;
  --f-label:var(--f-mono);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1110; --surface:#151D1B; --sunk:#1D2825; --ink:#ECF2EE; --muted:#A7B6AF; --line:#2D3B37;
    --accent:#8ECB9D; --accent-hover:#A8D9B4; --accent-ink:#0A2414; --accent-soft:#1A3022; --wood:#D9AE7E;
    --solid:#2F7D4F; --solid-hover:#38905C; --solid-ink:#F3FFF6; --okfill:#2F8A55;
    --pick-bg:#1E3A29; --pick-ink:#D5F0DE; --pick-line:#5FA77A; --tab-on:#2C3B37;
    --ok:#6DC491; --warn:#E3A94B; --danger:#F08A80; --scrim:rgba(0,0,0,.62);
    --wa:#3DC27A; --wa-ink:#06200F; --mark-filter:none; --line-inv:#D5C7CB; --mark-dim:1;
    --c-resto:#EE7799; --c-endo:#6CC0DE; --c-bur:#A3A8F0; --c-imp:#6DCBB5; --c-disp:#DDB75E; --c-kit:#C99BE0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1110; --surface:#151D1B; --sunk:#1D2825; --ink:#ECF2EE; --muted:#A7B6AF; --line:#2D3B37;
  --accent:#8ECB9D; --accent-hover:#A8D9B4; --accent-ink:#0A2414; --accent-soft:#1A3022; --wood:#D9AE7E;
  --solid:#2F7D4F; --solid-hover:#38905C; --solid-ink:#F3FFF6; --okfill:#2F8A55;
  --pick-bg:#1E3A29; --pick-ink:#D5F0DE; --pick-line:#5FA77A; --tab-on:#2C3B37;
  --ok:#6DC491; --warn:#E3A94B; --danger:#F08A80; --scrim:rgba(0,0,0,.62);
  --wa:#3DC27A; --wa-ink:#06200F; --mark-filter:none; --line-inv:#D5C7CB; --mark-dim:1;
  --c-resto:#EE7799; --c-endo:#6CC0DE; --c-bur:#A3A8F0; --c-imp:#6DCBB5; --c-disp:#DDB75E; --c-kit:#C99BE0;
  color-scheme:dark;
}
:root[lang="ar"]{--f-display:var(--f-arabic-text);--f-body:var(--f-arabic-text);--f-label:var(--f-arabic-text)}
:root[lang="ar"] body *{letter-spacing:normal!important}
:root[lang="ar"] body{line-height:1.7}
:root[lang="ar"] .pname,:root[lang="ar"] .line h4,:root[lang="ar"] .list-head h2{line-height:1.55}

*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}

/* logo watermark: fixed behind everything, content scrolls over it */
.bgmark{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;opacity:.1;color:var(--accent)}
.notice,.check-bar,main,footer{position:relative;z-index:1}
.bgmark img{display:block;width:min(88vw,900px);max-width:100%;height:auto;filter:var(--mark-filter)}
.logo-slot{width:min(100%,440px);aspect-ratio:1400/261}
.bgmark img{transform-origin:center center;will-change:transform,filter}

/* sample notice */
.notice{background:var(--accent-soft);font-size:13.5px}
.notice .wrap{padding-block:8px}
.notice b{font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;flex:none;margin-inline-end:auto}
.brand .ico{width:30px;height:30px;color:var(--accent)}
.mark .stick{stroke:var(--wood)}
.brand .wm{font:800 20px/1 var(--f-display);letter-spacing:-.02em}
.brand .alt{font:600 15px/1 var(--f-arabic);color:var(--wood);margin-inline-start:7px}
:root[lang="ar"] .brand .wm{font:600 23px/1 var(--f-arabic)}
:root[lang="ar"] .brand .alt{font:700 13px/1 "Schibsted Grotesk",Arial,sans-serif}
.brand small{display:block;font:500 10px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
:root[lang="ar"] .brand small{font-size:11.5px;margin-top:5px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding-inline:38px 14px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.hbtn{flex:none;height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.hbtn .ico{width:18px;height:18px}
.lang-btn[lang="ar"]{font-family:var(--f-arabic-text);font-size:15px}
.lang-btn[lang="en"]{font-family:"Source Sans 3",Arial,sans-serif}
.cart-btn{border:0;background:var(--ink);color:var(--bg);padding:0 11px 0 13px}
.cart-btn .count{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:600 12px/22px var(--f-mono);text-align:center;padding:0 6px}
.cart-btn.bump .count{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:640px){.search{order:5;flex-basis:100%}}
@media (max-width:440px){.brand small,.hbtn .lbl{display:none}.hbtn{padding:0 11px}}
@media (max-width:360px){.brand .alt{display:none}}

/* hero */
.hero .wrap{display:grid;gap:22px;padding-block:26px 6px}
.hero h1{font:800 clamp(30px,7vw,52px)/1.06 var(--f-display);letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
:root[lang="ar"] .hero h1{font-weight:700;line-height:1.45;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:12px 0 0;color:var(--muted);font-size:17px;max-width:52ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:16px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.facts li{padding:5px 11px 5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
:root[lang="ar"] .facts{font-size:14px;font-weight:600}
.facts li{display:flex;align-items:center;gap:7px}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.guide-box{align-self:end}
@media (max-width:640px){
  .hero .wrap > div > p{display:none}
  .logo-slot{width:min(80%,340px);margin:0 auto}
  .hero h1{text-align:center;margin-inline:auto}
  .facts{justify-content:center}
  .hero h1{font-size:clamp(27px,7.6vw,34px)}
  .facts{margin-top:14px;gap:6px}
  .facts li{font-size:12px;padding:4px 10px 4px 8px}
  .gift{padding:11px 14px;gap:10px;margin-top:16px}
  .gift b{font-size:15px}
  .gift span{font-size:13px;line-height:1.45}
}
.guide{display:flex;gap:5px;align-items:flex-start;direction:ltr}
.gt{flex:1 1 0;max-width:38px;display:flex;flex-direction:column;align-items:center;gap:5px}
.gt i{display:block;width:100%;aspect-ratio:3/5;border-radius:5px 5px 45% 45%/5px 5px 30% 30%;background:var(--c);box-shadow:inset 0 -7px 10px var(--tab-shade),inset 0 0 0 1px var(--tab-edge)}
.gt b{font:500 10.5px var(--f-mono);color:var(--muted)}
.gt.off i{opacity:.32}
.gt.off b{opacity:.55}
.guide-cap{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.guide-cap strong{color:var(--ink);font-weight:600}
@media (min-width:820px){.hero .wrap{grid-template-columns:1.25fr 1fr;align-items:end;padding-block:44px 10px}}

/* free miswak gift */
.gift{position:relative;display:flex;gap:12px;align-items:center;margin-top:18px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--wood);max-width:460px;box-shadow:0 6px 20px -12px var(--wood)}
.gift > .ico{width:34px;height:34px;color:var(--wood);flex:none;animation:wiggle 1.2s ease-in-out .6s 2}
.gift b{display:block;font:700 16.5px/1.3 var(--f-display);color:var(--ink)}
.gift span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.gift em{position:absolute;top:-10px;inset-inline-end:12px;font-style:normal;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--wood);color:var(--surface);border-radius:999px;padding:2px 10px}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.totals .gift-row span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--wood);font-weight:600}
.totals .gift-row span:last-child{color:var(--ok);font-weight:700}
.totals .gift-row .ico{width:16px;height:16px}

/* roomier opening screen */
.hero .wrap{min-height:calc(100svh - 70px);align-content:center;padding-block:36px 28px}
.cue{justify-self:center;display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:15px 28px 15px 32px;border-radius:999px;background:var(--solid);color:var(--solid-ink);text-decoration:none;font:700 17px var(--f-display);letter-spacing:-.005em;box-shadow:0 10px 26px -12px var(--accent),0 2px 6px -2px var(--scrim);transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.cue:hover{background:var(--solid-hover);transform:translateY(-2px)}
.cue:active{transform:translateY(0) scale(.98)}
:root[lang="ar"] .cue{padding:13px 32px 15px 28px;font-size:18px}
.cue .ico{width:22px;height:22px;stroke-width:2.4;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.why .wrap{display:grid;gap:10px;padding-top:28px}
.why .eyebrow{justify-self:center}
.why-intro{display:grid;gap:12px;justify-items:center;text-align:center;max-width:720px;margin:0 auto 18px}
.why-intro h2{margin:0;font:800 clamp(24px,5.5vw,34px)/1.2 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
:root[lang="ar"] .why-intro h2{font-weight:700;line-height:1.4}
.why-intro p{margin:0;color:var(--muted);font-size:16px;line-height:1.65}
.why-intro .hadith{border:0;padding:6px 0 0;margin:4px 0 0}
.why-intro .hadith blockquote{font:600 19px/1.6 var(--f-display);color:var(--ink)}
:root[lang="ar"] .why-intro .hadith blockquote{font:600 22px/1.7 var(--f-arabic)}
.why-intro .hadith::before{content:"";display:block;width:40px;height:2px;background:var(--wood);margin:0 auto 14px;border-radius:2px}
.hadith-list{display:grid;gap:16px}
#shelves{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;margin-top:28px}
.shelf{min-width:0}
#shelves:empty{display:none}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.shelf-head h3{margin:0;font:800 21px var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
:root[lang="ar"] .shelf-head h3{font-weight:700}
.shelf-head h3::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--wood);transform:rotate(45deg)}
.shelf-sale .shelf-head h3::before{background:var(--danger)}
.shelf-feat .shelf-head h3::before{background:var(--accent)}
.shelf-head span{color:var(--muted);font-size:14px}
.shelf-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,42%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin-inline:-2px;scrollbar-width:thin;overscroll-behavior-x:contain}
.shelf-row .card{scroll-snap-align:start}
@media (min-width:700px){.shelf-row{grid-auto-columns:minmax(200px,calc((100% - 36px)/4))}}
.cats{margin-top:8px}
.price s{display:block;font:500 12.5px/1.2 var(--f-label);color:var(--muted);text-decoration-thickness:1.5px}
.tile .off{position:absolute;inset-inline-start:8px;bottom:8px;z-index:2;background:var(--danger);color:var(--surface);font:800 12px var(--f-label);border-radius:6px;padding:2px 7px}
.was-line{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.was-line s{color:var(--muted)}
.was-line b{font:800 18px var(--f-display)}
.was-line em{font-style:normal;font-weight:700;font-size:13px;color:var(--surface);background:var(--danger);border-radius:6px;padding:1px 8px}
.shop-head{padding-top:72px;display:grid;gap:4px;justify-items:center;text-align:center}
.shop-head::before{content:"";width:56px;height:3px;border-radius:2px;background:var(--wood);margin-bottom:14px}
.eyebrow{font:600 12px var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--wood)}
:root[lang="ar"] .eyebrow{font-size:14px}
.shop-head h2{margin:0;font:800 clamp(24px,5.5vw,34px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
:root[lang="ar"] .shop-head h2{font-weight:700;line-height:1.4}
@media (min-width:820px){.hero .wrap{min-height:calc(100svh - 64px)}.cue{grid-column:1/-1;grid-row:3}
  .hero-copy{grid-column:1;grid-row:1/3;align-self:center}
  .logo-slot{grid-column:2;grid-row:1;width:min(100%,500px);justify-self:center;align-self:end;margin-bottom:28px}
  .guide-box{grid-column:2;grid-row:2;align-self:start}}

/* categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:18px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip small{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pick-bg);color:var(--pick-ink);border-color:var(--pick-line)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.list-head h2{font:700 20px var(--f-display);letter-spacing:-.01em;margin:0;min-width:0}
.list-head span{font:500 12px var(--f-label);color:var(--muted);flex:none}
:root[lang="ar"] .list-head span{font-size:13.5px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;padding-bottom:36px}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:4/3;width:100%;max-width:100%;border:0;background:var(--sunk);cursor:pointer;color:var(--cat);padding:0;overflow:hidden}
.tile.photo{background:var(--photo-bg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-width:100%;z-index:1;background:var(--photo-bg)}
.tile .ico{width:46px;height:46px;stroke-width:1.3}
.tile .sku,.tile .tag{z-index:2}
.tile .sku{position:absolute;inset-inline-start:8px;top:7px;font:500 10.5px var(--f-mono);letter-spacing:.04em;color:var(--muted);direction:ltr}
.tile.photo .sku{background:var(--surface);border-radius:6px;padding:1px 6px}
.tile .tag{position:absolute;inset-inline-end:8px;top:7px;font-weight:700;font-size:11.5px;background:var(--surface);color:var(--cat);border-radius:999px;padding:1px 8px;box-shadow:0 0 0 1px var(--line)}
.vis{position:absolute;left:8px;right:8px;bottom:9px;display:flex;gap:4px;justify-content:center;align-items:flex-end;direction:ltr}
.mt{width:11px;height:17px;border-radius:2px 2px 6px 6px;background:var(--c);box-shadow:inset 0 0 0 1px var(--tab-edge)}
.iso{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.grit{width:16px;height:6px;border-radius:3px;background:var(--c)}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pname{font:700 15px/1.3 var(--f-display);margin:0;letter-spacing:-.005em}
.spec{font-size:13.5px;line-height:1.4;color:var(--muted);margin:0}
.stock{font-weight:700;font-size:12.5px;margin-top:3px}
.stock.in{color:var(--ok)}
.stock.low{color:var(--warn)}
.stock.out{color:var(--danger)}
.buy{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{font:700 17px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font:500 11px var(--f-label);color:var(--muted);margin-inline-start:3px}
.add{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--solid);color:var(--solid-ink);font-weight:700;font-size:14px;cursor:pointer}
.add:hover{background:var(--solid-hover)}
.add.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.add.alt:hover{background:var(--accent-soft)}
.add:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.empty-list{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--muted)}
.req-card{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:8px;padding:34px 22px;border-radius:calc(var(--radius) + 6px);background:var(--surface);border:1px solid var(--line);animation:giftPop .5s cubic-bezier(.2,.9,.3,1.2) both}
.req-ico{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.req-ico .ico{width:24px;height:24px}
.req-card b{font:800 19px/1.3 var(--f-display);color:var(--ink);text-wrap:balance}
.req-card p{margin:0 0 10px;color:var(--muted);max-width:44ch;line-height:1.55}
.req-card .btn{width:auto;padding-inline:26px}
.req-line{grid-column:1/-1;text-align:center;color:var(--muted);margin:10px 0 0;font-size:14.5px}
.req-line a{color:var(--accent);font-weight:700;text-underline-offset:3px}

/* how it works */
.how{border-top:1px solid var(--line)}
.how .wrap{padding-block:30px}
.how h2{font:700 20px var(--f-display);margin:0 0 16px}
.how ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;list-style:none;padding:0;margin:0;counter-reset:s}
.how li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.how li::before{content:counter(s);font:800 26px/1 var(--f-display);color:var(--accent);grid-row:span 2}
.how b{font-weight:700}
.how li span{color:var(--muted);font-size:15px;grid-column:2}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer .wrap{padding-block:22px 28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
footer .story{display:grid;gap:10px;flex-basis:100%;margin:0 0 8px;color:var(--ink);font-size:15.5px;max-width:62ch}
footer .story p{margin:0}
.hadith{margin:0;padding-inline-start:16px;border-inline-start:3px solid var(--wood)}
.hadith blockquote{margin:0;font-size:17px;line-height:1.6;color:var(--ink)}
:root[lang="ar"] .hadith blockquote{font-size:19px}
.benefits{max-width:none}
.benefits summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-weight:700;font-size:15.5px}
.benefits summary::-webkit-details-marker{display:none}
.benefits summary .chev{width:18px;height:18px;flex:none;transition:transform .2s}
.benefits[open] summary .chev{transform:rotate(180deg)}
.refs{margin:0;padding-inline-start:20px;display:grid;gap:10px}
.refs li{padding-inline-start:4px}
.refs a{color:var(--accent);font-weight:600;text-underline-offset:3px;display:inline}
.refs span{display:block;font-size:13.5px;margin-top:2px}
.ben-body{display:grid;gap:12px;padding-top:14px}
.benefits h2{margin:8px 0 0;font:700 19px var(--f-display);color:var(--ink)}
.benefits ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.benefits li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:3px}
.benefits li b{color:var(--ink);font-weight:700;font-size:15px}
.benefits li span{font-size:14px;line-height:1.5}
footer .story{max-width:none}
footer .story > p,.hadith{max-width:none}
.hadith figcaption{margin-top:4px;font-size:13.5px;color:var(--muted)}
footer .story .ar{font:600 20px/1 var(--f-arabic);color:var(--wood);margin-inline-end:10px}
footer .contact{flex-basis:100%;text-align:center;margin:0 0 6px;color:var(--ink);font-size:15px}
footer .contact a{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;text-underline-offset:3px}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:var(--scrim)}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;cursor:pointer;flex:none}
.x .ico{width:18px;height:18px}
#productSheet{width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow:auto}
@media (min-width:700px){#productSheet{margin:auto;border-radius:20px}}
.sheet{padding:18px max(20px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-top .sku{font:500 12px var(--f-label);color:var(--muted);letter-spacing:.04em}
.sheet .tile{border-radius:14px;aspect-ratio:16/10;cursor:default}
.sheet .tile .ico{width:64px;height:64px}
.sheet h3{font:800 24px/1.2 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
:root[lang="ar"] .sheet h3{font-weight:700;line-height:1.55}
.sheet .spec{font-size:15px;margin-top:4px}
.sheet .desc{margin:0;font-size:15.5px;max-width:60ch}
.opt-label{font-weight:700;font-size:14px;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.shade-opt{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:6px;border-radius:10px;cursor:pointer}
.shade-opt i{display:block;width:30px;height:48px;border-radius:5px 5px 45% 45%/5px 5px 30% 30%;background:var(--c);box-shadow:inset 0 -7px 10px var(--tab-shade),inset 0 0 0 1px var(--tab-edge)}
.shade-opt b{font:500 12px var(--f-mono)}
.shade-opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.chip .sw{width:14px;height:6px;border-radius:3px;background:var(--c)}
.sheet-buy{display:flex;gap:12px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:44px;flex:none;direction:ltr}
.qty button{width:40px;height:100%;border:0;background:none;font-weight:700;font-size:19px;cursor:pointer;border-radius:999px}
.qty button:disabled{color:var(--muted);opacity:.5;cursor:not-allowed}
.qty output{min-width:26px;text-align:center;font:600 15px var(--f-mono)}
.qty.sm{height:34px}
.qty.sm button{width:32px;font-size:16px}
.btn{height:48px;flex:1;width:100%;border-radius:999px;border:0;background:var(--solid);color:var(--solid-ink);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 18px}
.btn:hover{background:var(--solid-hover)}
.btn:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.sm{height:40px;font-size:14.5px;flex:none;width:auto;padding:0 16px}
.btn .ico{width:20px;height:20px}
.note{font-size:13.5px;margin:0}
.note.warn{color:var(--warn);font-weight:600}

.side{margin:0;margin-inline-start:auto;width:min(440px,100%);height:100%;max-height:100%;border-radius:0}
.side[open]{display:flex;flex-direction:column}
.cart-head{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.cart-head h2{font:800 20px var(--f-display);letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.cart-body{flex:1;overflow:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
.cart-foot{border-top:1px solid var(--line);padding:14px max(18px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:10px;background:var(--surface)}
.cart-foot:empty{display:none}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line h4{margin:0;font:700 15px/1.3 var(--f-display)}
.line .meta{font-size:13.5px;color:var(--muted)}
.line .lt{font:700 15px var(--f-display);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.link{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.totals{display:grid;gap:5px;font-variant-numeric:tabular-nums;font-size:15px}
.totals .row{display:flex;justify-content:space-between;gap:12px}
.totals .row span:first-child{color:var(--muted)}
.totals .total{font:800 19px var(--f-display);padding-top:7px;border-top:1px solid var(--line);margin-top:3px}
.totals .total span:first-child{color:var(--ink)}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.empty{text-align:center;padding:40px 8px;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty .ico{width:44px;height:44px;color:var(--line)}
.empty b{color:var(--ink);font:700 17px var(--f-display)}

form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label,.legend{font-weight:700;font-size:14px}
.opt-txt{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}
.field textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.field [aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.pick{position:relative}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14.5px}
.pick input:checked + span{background:var(--pick-bg);color:var(--pick-ink);border-color:var(--pick-line)}
.pick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.summary{background:var(--bg);border-radius:12px;padding:14px}

.done-mark{width:56px;height:56px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center}
.done-mark .ico{width:30px;height:30px;stroke-width:2}
.done{display:grid;gap:12px}
.done h3{font:800 22px/1.25 var(--f-display);margin:0;letter-spacing:-.01em}
.done p{margin:0}
.order-no{font:600 15px var(--f-mono);color:var(--accent)}
#orderText{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font:400 13.5px/1.55 var(--f-body);resize:vertical}

.gt i,.mt,.shade-opt i,.iso,.grit,.chip .sw{--tab-shade:var(--tab-shade-inv);--tab-edge:var(--tab-edge-inv);--line:var(--line-inv);background:var(--c);filter:invert(1)}
/* Samsung Internet repaints colours in its own dark mode and sites can't opt out,
   so on Samsung Internet the colour swatches are replaced by their names */
.samsung .gt i,.samsung .vis,.samsung .shade-opt i,.samsung .chip .sw{display:none}
.samsung .guide{flex-wrap:wrap;gap:6px}
.samsung .gt{flex:none;max-width:none}
.samsung .gt b{font:600 13px var(--f-mono);color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px}
.samsung .gt.off b{opacity:.45}
.samsung .shade-opt{min-height:38px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;justify-content:center}
.samsung .shade-opt b{font-size:14px}
/* about & contact */
footer .foot-links{flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 10px}
footer .foot-links .btn{color:var(--ink)}
#hadithSheet .hadith{max-width:none}
.about-mark{display:flex;align-items:center;gap:12px}
.about-mark .ico{width:44px;height:44px;color:var(--accent)}
.about-mark b{display:block;font:800 24px/1.1 var(--f-display)}
:root[lang="ar"] .about-mark b{font:600 28px/1.2 var(--f-arabic)}
.about-mark span{font-size:13.5px;color:var(--muted)}
.about-intro{margin:0;font-size:16px}
#aboutBody h3{margin:6px 0 0;font:700 17px var(--f-display)}
#aboutBody p{margin:0}
.owners{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.owners li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.owners img.avatar{object-fit:cover;max-width:none}
.owners .avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 16px var(--f-display);flex:none;direction:ltr}
.owners b{display:block;font-size:16px}
.owners li span:not(.avatar){font-size:13.5px;color:var(--muted)}
.sel{user-select:all;font-weight:700;color:var(--ink)}

/* policies + agreement */
.policies section{display:grid;gap:6px}
.policies h3{margin:0;font:700 17px var(--f-display)}
.policies ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:15px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:400;cursor:pointer;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.agree input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.agree-field [aria-invalid="true"] + span{color:var(--danger)}
.inline-link{border:0;background:none;padding:0;font:inherit;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* loading, load error, live check */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;animation:pulse 1.4s ease-in-out infinite}
.skel i{display:block;aspect-ratio:4/3;background:var(--sunk)}
.skel b{display:block;height:12px;margin:12px 12px 0;border-radius:6px;background:var(--sunk)}
.skel b + b{width:55%;margin-bottom:14px}
@keyframes pulse{50%{opacity:.55}}
.load-err{grid-column:1/-1;padding:28px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:grid;gap:12px;justify-items:center;text-align:center}
.load-err b{font:700 17px var(--f-display)}
.load-err .btn{width:auto;flex:none}
.check-bar{background:var(--ink);color:var(--bg);font-size:13.5px}
.check-bar.bad{background:var(--danger);color:var(--surface)}
.check-bar .wrap{padding-block:9px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border:0;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14.5px;z-index:60;box-shadow:0 8px 24px var(--scrim);cursor:pointer;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast u{text-underline-offset:3px}

.anim .rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease var(--d,0ms),transform .8s cubic-bezier(.2,.75,.2,1) var(--d,0ms)}
.anim .rv.in{opacity:1;transform:none}
.anim .card.rv{transform:translateY(18px) scale(.98);transition-duration:.5s,.6s}
.anim .card.rv.in{transform:none}
.card{transition:transform .2s ease,box-shadow .2s ease}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -18px var(--scrim)}}
.anim .card.rv.in:hover{transform:translateY(-3px)}
.benefits[open] .ben-body{animation:dropIn .35s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---- calm pass ---- */
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .top{background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
}
.card .tile .sku,.sheet .tile .sku{display:none}

.card{border-color:color-mix(in srgb,var(--line) 75%,transparent)}
.card-body{gap:2px}
.tile .tag{color:var(--accent)}
.tile .off{background:var(--wood);color:var(--surface)}
.was-line em{background:var(--wood)}
#shelves{margin-top:36px}
.stabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--sunk);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;margin:0 auto}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;border:0;background:transparent;color:var(--muted);font:700 14px var(--f-display);padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,transform .25s cubic-bezier(.3,1.4,.5,1)}
.stabs button[aria-selected="true"]{background:var(--tab-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px -6px var(--scrim)}
.shelf-sub{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 14px}
.shelf .shelf-head{justify-content:center}
.shelf .shelf-head h3::before{display:none}
.trust{border-top:1px solid var(--line)}
.trust .wrap{padding-block:40px}
.trust ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.trust li{display:grid;justify-items:center;text-align:center;gap:4px}
.trust .ico{width:30px;height:30px;color:var(--accent);margin-bottom:6px;stroke-width:1.6}
.trust b{font:700 16px var(--f-display);color:var(--ink)}
.trust span{color:var(--muted);font-size:14px}
.how .wrap{padding-block:44px}
dialog[open]{animation:sheetUp .42s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fadeIn .3s ease}
dialog.closing{animation:sheetDown .24s cubic-bezier(.4,0,1,1) forwards}
dialog.closing::backdrop{animation:fadeOut .24s ease forwards}
@keyframes sheetDown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(30px)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet .sheet-buy{position:sticky;bottom:calc(-1 * max(22px,env(safe-area-inset-bottom,0px)));z-index:3;background:var(--surface);margin:0 -20px calc(-1 * max(22px,env(safe-area-inset-bottom,0px)));padding:12px 20px max(22px,env(safe-area-inset-bottom,0px));box-shadow:0 -12px 18px -14px var(--scrim)}
.sheet .sheet-buy .btn{flex:1}
.done .gift{text-align:start;margin:6px auto 10px;width:100%;animation:giftPop .6s .25s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes giftPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:640px){
  .trust .wrap{padding-block:30px}
  .trust ul{grid-template-columns:repeat(3,1fr);gap:10px}
  .trust .ico{width:26px;height:26px;margin-bottom:4px}
  .trust b{font-size:13.5px;line-height:1.3}
  .trust span{font-size:12px;line-height:1.35}
  .stabs button{padding:8px 13px;font-size:13.5px}
}
body{overflow-x:clip}
/* ---- language pill ---- */
.lang-pill{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:8px 16px 8px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--wood) 45%,var(--line));background:color-mix(in srgb,var(--wood) 10%,var(--surface));color:var(--ink);font:700 14px var(--f-arabic);cursor:pointer}
:root[lang="ar"] .lang-pill{font-family:var(--f-display);padding:8px 12px 8px 16px}
.lang-pill .ico{width:17px;height:17px;color:var(--wood)}
.lang-pill:hover{border-color:var(--wood)}
@media (max-width:640px){.hero-copy{display:grid;justify-items:center}.hero-copy .gift,.hero-copy ul{justify-self:stretch}}
.foot-links .lang-pill{margin:0;background:var(--surface)}
/* ---- floating WhatsApp ---- */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#25D366;color:#fff;box-shadow:0 10px 26px -8px rgba(18,140,70,.55),0 2px 6px rgba(0,0,0,.18);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s ease;animation:fabIn .6s 1.2s cubic-bezier(.2,1.3,.4,1) both}
.fab .ico{width:30px;height:30px;stroke:#fff;stroke-width:1.7}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;background:#25D366;z-index:-1;animation:fabRing 2.6s 2s ease-out infinite}
.fab.ready{animation:none}
.fab.drag{transition:none;cursor:grabbing;animation:none}
.fab.gone{transition:transform .36s cubic-bezier(.5,0,.9,.4),opacity .36s ease;animation:none}
.fab:active:not(.drag){transform:scale(.92)}
.fab-tip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font:600 13px var(--f-display);padding:7px 12px;border-radius:999px;pointer-events:none;opacity:0}
.fab.tip .fab-tip{animation:tipIn 4.5s ease both}
.fab.drag .fab-tip,.fab.gone .fab-tip{display:none}
@keyframes fabIn{from{opacity:0;transform:translateY(24px) scale(.5)}to{opacity:1;transform:none}}
@keyframes fabRing{0%{transform:scale(1);opacity:.45}70%,100%{transform:scale(1.55);opacity:0}}
@keyframes tipIn{0%{opacity:0;transform:translate(8px,-50%)}10%,85%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(8px,-50%)}}
@media (hover:hover){.fab:hover .fab-tip{animation:none;opacity:1;transform:translate(0,-50%)}}
body.has-fab .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
/* ---- fast-scroll pill ---- */
.jump{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:44;display:inline-flex;align-items:center;gap:8px;padding:11px 18px 11px 14px;border:0;border-radius:999px;background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--bg);font:700 14.5px var(--f-display);box-shadow:0 10px 28px -10px var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;opacity:0;pointer-events:none;transform:translate(-50%,20px) scale(.9);transition:opacity .3s ease,transform .4s cubic-bezier(.3,1.4,.5,1)!important}
:root[lang="ar"] .jump{padding:11px 14px 11px 18px}
.jump .ico{width:18px;height:18px;stroke-width:2.4;transition:transform .3s ease}
.jump[data-dir="down"] .ico{transform:rotate(180deg)}
.jump.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.jump.show:active{transform:translate(-50%,0) scale(.94)}
body.has-fab .jump{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
/* ---- suggestions ---- */
.sheet,.cart-body{grid-template-columns:minmax(0,1fr)}
.pairs{min-width:0}
.pairs h4{margin:4px 0 10px;font:700 16px var(--f-display);color:var(--ink)}
.pairs-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,40%);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.pair{display:grid;gap:4px;align-content:start;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);scroll-snap-align:start}
.pair-tile{display:grid;place-items:center;aspect-ratio:4/3;width:100%;border:0;border-radius:10px;background:var(--sunk);color:var(--cat);cursor:pointer;overflow:hidden;padding:0}
.pair-tile.photo{background:var(--photo-bg)}
.pair-tile img{width:100%;height:100%;object-fit:contain}
.pair-tile .ico{width:30px;height:30px}
.pair b{font-size:13.5px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pair .price{font-size:14.5px}
.pair-add{margin-top:4px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;font-weight:700;font-size:13px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pair-add:disabled{opacity:.4;cursor:default}
.added{background:var(--okfill)!important;border-color:var(--okfill)!important;color:#fff!important}
.added .ico{width:16px;height:16px;stroke-width:2.6;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.sheet-acts{display:flex;gap:8px}
/* ---- sticky cart bar (phones) ---- */
.cartbar{display:none}
@media (max-width:640px){
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:43;align-items:center;gap:10px;padding:10px 12px 10px 10px;border:0;border-radius:18px;background:var(--solid);color:var(--solid-ink);font:700 15px var(--f-display);box-shadow:0 14px 30px -12px var(--solid),0 4px 12px -4px var(--scrim);transform:translateY(140%);transition:transform .45s cubic-bezier(.3,1.3,.5,1)!important;cursor:pointer}
  .cartbar.show{transform:none}
  .cartbar.show:active{transform:scale(.97)}
  .cartbar.pop{animation:barPop .45s ease}
  .cb-n{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:10px;background:color-mix(in srgb,var(--solid-ink) 18%,transparent);font-size:14px}
  .cb-t{flex:1;text-align:start;font-weight:600;opacity:.95}
  .cb-go{display:inline-flex;align-items:center;gap:4px}
  .cb-go .ico{width:18px;height:18px;stroke-width:2.4}
  body.has-bar .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.has-bar .jump{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.has-bar .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  body.has-bar footer{padding-bottom:70px}
}
@keyframes barPop{40%{transform:translateY(-6px) scale(1.02)}}
/* ---- free delivery ---- */
.free{display:grid;gap:7px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:var(--accent-soft)}
.free p{margin:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink)}
.free p .ico{width:18px;height:18px;color:var(--accent);flex:none}
.free-bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden}
.free-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.free.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.free-tag{color:var(--ok)}
.was-fee{color:var(--muted);font-weight:500;margin-inline-end:4px}
.cartbar{overflow:hidden}
.cartbar::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p,0%);background:color-mix(in srgb,var(--solid-ink) 55%,transparent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.cartbar.free-ok::after{background:#F2C14E}
#q.glow{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
/* ---- discount codes ---- */
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.promo-row .btn{flex:none;width:auto}
.promo-msg{margin:6px 0 0;font-size:13.5px;color:var(--muted);min-height:0}
.promo-msg:empty{display:none}
.promo-msg.ok{color:var(--ok);font-weight:700}
.promo-msg.bad{color:var(--danger)}
.disc-row span:last-child{color:var(--ok);font-weight:700}
.mycode{margin-top:16px;padding:16px;border-radius:16px;border:1.5px dashed var(--wood);background:color-mix(in srgb,var(--wood) 8%,var(--surface));display:grid;gap:8px;justify-items:center;text-align:center;animation:giftPop .6s cubic-bezier(.2,.9,.3,1.3) both}
.mycode.wait{color:var(--muted);font-weight:600}
.mc-k{margin:0;font-weight:700}
.mc-code{font:800 28px var(--f-mono);letter-spacing:.12em;color:var(--wood);padding:6px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mc-left{margin:0;color:var(--muted);font-size:13.5px}
.mc-acts{display:grid;gap:8px;width:100%}
/* ---- explore & play ---- */
.play{border-top:1px solid var(--line);margin-top:28px}
.play .wrap{padding-block:48px}
.play-head{display:grid;justify-items:center;text-align:center;gap:6px;margin-bottom:22px}
.play-head h2{margin:0;font:800 clamp(24px,5.5vw,32px)/1.2 var(--f-display);letter-spacing:-.02em}
:root[lang="ar"] .play-head h2{font-weight:700;line-height:1.4}
.play-head p{margin:0;color:var(--muted);max-width:46ch}
.play-grid{display:grid;gap:16px}
@media (min-width:820px){.play-grid{grid-template-columns:1fr 1fr;align-items:start}}
.explorer,.quiz{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 8px);padding:20px;min-width:0}
.ex-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;position:relative;margin-bottom:14px}
.ring{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring-bg{stroke:var(--sunk)}
.ring-fg{stroke:var(--wood);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-n{position:absolute;inset-inline-start:0;top:50%;width:64px;transform:translateY(-50%);text-align:center;font:800 15px var(--f-display)}
.ex-top h3{margin:0;font:800 19px var(--f-display)}
.ex-top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ex-list button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-align:start}
.ex-list button span{flex:1}
.ex-list i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.ex-list .ok{color:var(--muted)}
.ex-list .ok span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ex-list .ok i{background:var(--okfill);border-color:var(--okfill);color:#fff}
.ex-list .ok i .ico{width:14px;height:14px;stroke-width:3;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.ex-list .go{width:16px;height:16px;color:var(--muted)}
.ex-share{margin-top:14px;width:100%}
.qz-intro,.qz-end{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.qz-emoji{font-size:44px;line-height:1;animation:wiggle 2.4s ease-in-out infinite}
.quiz h3{margin:0;font:800 19px/1.35 var(--f-display);text-wrap:balance}
.qz-intro p{margin:0 0 6px;color:var(--muted);max-width:40ch}
.qz-q{display:grid;gap:12px;animation:dropIn .35s ease}
.qz-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.qz-dots{display:flex;gap:5px}
.qz-dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.qz-dots i.past{background:var(--wood)}
.qz-dots i.now{background:var(--accent);transform:scale(1.25)}
.qz-opts{display:grid;gap:8px}
.qz-opt{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;text-align:start;cursor:pointer}
.qz-opt:hover:not(:disabled){border-color:var(--accent)}
.qz-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));animation:pop .35s ease}
.qz-opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface));animation:shake .4s ease}
.qz-opt.dim{opacity:.5}
.qz-opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.qz-why{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}
.qz-why b{color:var(--ink)}
.qz-score{display:flex;align-items:baseline;gap:2px;font:800 54px/1 var(--f-display);color:var(--accent)}
.qz-score span{font-size:24px;color:var(--muted)}
.qz-score.perfect{color:var(--wood);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.qz-acts{display:grid;gap:8px;width:100%;max-width:320px}
.confetti{position:fixed;inset:0;z-index:200;pointer-events:none}
/* ---- FAQ ---- */
.faq{border-top:1px solid var(--line)}
.faq .wrap{padding-block:40px;display:grid;gap:10px}
.faq h2{font:700 20px var(--f-display);margin:0 0 8px}
.faq .ben-body p{margin:0;color:var(--muted);line-height:1.6}
/* ---- press feedback on everything tappable ---- */
button,a,summary,.chip,label.agree,.tile{-webkit-tap-highlight-color:transparent}
button,summary,.chip,label.agree,a.btn,a.cue{transition:transform .28s cubic-bezier(.3,1.4,.5,1),background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
a{transition:opacity .2s ease,color .2s ease}
button:active:not(:disabled),.chip:active,a.btn:active,label.agree:active{transform:scale(.95);transition-duration:.09s}
summary:active,.tile:active:not(:disabled),.sheet-buy .btn:active:not(:disabled),.cart-foot .btn:active,.stabs button:active{transform:scale(.975);transition-duration:.09s}
a:not(.btn):not(.cue):not(.fab):active{opacity:.55;transition-duration:.05s}
.toast:active{transform:translateX(-50%) scale(.96)}
button:disabled{transition:opacity .2s ease}

function $(s, r){ return (r || document).querySelector(s); }

function faqText(x, s){
  if (x.indexOf("{free}") < 0) return x;
  if (s.freeOver > 0) return x.split("{free}").join(t("faqFree", {t: money(s.freeOver)}) + " ");
  x = x.split("{free}").join(""); return x.charAt(0).toUpperCase() + x.slice(1);
}

  if (!el) return;
  var top = document.querySelector(".top"), off = (top ? top.offsetHeight : 0) + 8;
  smoothY(el.getBoundingClientRect().top + (window.scrollY || 0) - off);

var autoScroll = false;
function smoothY(to){
  var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  to = Math.max(0, Math.min(maxY, to));

  if (CALM || Math.abs(dist) < 4){ window.scrollTo(0, to); return; }

  function stop(){ scrollAnim++; autoScroll = false; }

/* fast-scroll helper: a "back to top" / "go to bottom" pill that appears on quick flicks */
(function(){
  var lastY = 0, lastT = 0, v = 0, hideT = 0, btn = null, dir = 0;
  function el(){ return document.getElementById("jump"); }
  function hide(){ var b = el(); if (b) b.classList.remove("show"); dir = 0; }
  window.addEventListener("scroll", function(){
    var now = performance.now(), y = window.scrollY || 0, dt = now - lastT;
    if (dt > 0 && dt < 200) v = v * 0.6 + ((y - lastY) / dt) * 0.4; else v = 0;
    lastY = y; lastT = now;
    var b = el(); if (!b) return;
    clearTimeout(hideT); hideT = setTimeout(hide, 3000);
    if (autoScroll) return;

/* confetti, drawn on a throwaway canvas */
function confetti(){
  if (CALM) return;
  var c = document.createElement("canvas"), x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  c.className = "confetti"; document.body.appendChild(c);
  var cs = getComputedStyle(document.documentElement), cols = [cs.getPropertyValue("--accent"), cs.getPropertyValue("--wood"), "#F2C14E", "#E9DFC9", "#25D366"];
  var ps = []; for (var i = 0; i < 140; i++) ps.push({x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .4});
  var t0 = performance.now();
  (function f(now){
    var k = (now - t0) / 1900; x.clearRect(0, 0, W, H);
    ps.forEach(function(p){ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.globalAlpha = Math.max(0, 1 - k * k); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c.trim(); x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (k < 1) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* =================== LOADING THE CATALOGUE FROM GOOGLE SHEETS =================== */
var CAT_KEYS = {studentkits:"kit", kits:"kit", kit:"kit", restorative:"resto", resto:"resto", endodontics:"endo", endo:"endo", burs:"bur", bur:"bur", impression:"imp", imp:"imp", disposables:"disp", disp:"disp"};
var GRIT = {coarse:"--grit-c", medium:"--grit-m", fine:"--grit-f"};
function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function parseCSV(text){
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (q){
      if (c === '"'){ if (text.charAt(i + 1) === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function table(text){
  var rows = parseCSV(text);
  if (!rows.length) return [];
  var head = rows[0].map(norm);
  return rows.slice(1).map(function(r){ var o = {}; head.forEach(function(h, i){ if (h) o[h] = (r[i] || "").trim(); }); return o; });
}
function pick(o, keys){ for (var i = 0; i < keys.length; i++){ var v = o[keys[i]]; if (v != null && v !== "") return v; } return ""; }
function num(v){ var n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; }
function yes(v){ return /^(true|yes|y|1|x|نعم)$/i.test(String(v || "").trim()); }
function split(s){ return String(s || "").split(/[,،]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function photoUrl(s){
  s = String(s || "").trim(); if (!s) return "";
  if (/drive\.google\.com|docs\.google\.com/.test(s)){
    var m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/);
    return m ? "https://lh3.googleusercontent.com/d/" + m[1] + "=w900" : "";
  }
  return /^https:\/\//.test(s) ? s : "";
}
function toProduct(r, i, seen){
  var name = {en: pick(r, ["nameenglish","name"]), ar: pick(r, ["namearabic"])};
  if (!name.en && !name.ar) return null;
  if (yes(pick(r, ["hidefromsite","hide"]))) return null;
  var sku = pick(r, ["code","sku"]) || "ITEM-" + (i + 2);
  var id = sku; while (seen[id]) id += "-" + (i + 2); seen[id] = 1;
  var cat = CAT_KEYS[norm(pick(r, ["category"]))] || "other";
  var p = {id: id, sku: sku, cat: cat,
    price: num(pick(r, ["priceegp","price"])), stock: Math.max(0, Math.floor(num(pick(r, ["instock","stock"])))),
    name: name,
    spec: {en: pick(r, ["shortdetailsenglish","detailsenglish"]), ar: pick(r, ["shortdetailsarabic","detailsarabic"])},
    desc: {en: pick(r, ["descriptionenglish"]), ar: pick(r, ["descriptionarabic"])},
    tag: {en: pick(r, ["badgeenglish"]), ar: pick(r, ["badgearabic"])},
    opt: null, img: photoUrl(pick(r, ["photolink","photo"])),
    was: num(pick(r, ["oldpriceegp","oldprice","pricebeforediscount"])),
    best: yes(pick(r, ["bestseller","bestsellers"])), feat: yes(pick(r, ["featured"]))};
  var vals = split(pick(r, ["choicesenglish","choices"]));
  if (vals.length){
    var label = {en: pick(r, ["choicenameenglish"]), ar: pick(r, ["choicenamearabic"])};
    if (!label.en) label.en = label.ar || "Option";
    p.opt = {label: label, values: vals, values_ar: split(pick(r, ["choicesarabic"])), def: 0,
             style: vals.every(function(v){ return SHADE_VAR[v]; }) ? "shade" : "chip"};
    var sw = {}, any = false;
    vals.forEach(function(v){ if (GRIT[norm(v)]){ sw[v] = GRIT[norm(v)]; any = true; } });
    if (any){ p.opt.swatch = sw; p.grit = true; }
  }
  if (cat === "endo" && /\biso\b/i.test(p.spec.en)) p.iso = true;
  return p;
}
function toSettings(rows){
  var r = rows[0] || {}, s = Object.assign({}, DEFAULT_SETTINGS), fees = [];
  Object.keys(r).forEach(function(k){ if (k.indexOf("deliveryfee") === 0) fees.push(num(r[k])); });
  s.whatsapp = String(pick(r, ["whatsappnumber","whatsapp"])).replace(/\D/g, "");
  s.instapay = pick(r, ["instapayaddress","instapay"]);
  if (fees.length) s.fees = [0, 1, 2].map(function(i){ return fees[i] != null ? fees[i] : DEFAULT_SETTINGS.fees[i]; });
  s.notice = yes(pick(r, ["showpreviewbanner"]));
  var pu = String(pick(r, ["discountcodeslink","discountlink","promolink"]) || "").trim();
  s.promoUrl = /^https:\/\/script\.google(usercontent)?\.com\//.test(pu) ? pu : "";
  if ("freedeliveryoveregp" in r || "freedeliveryover" in r) s.freeOver = num(pick(r, ["freedeliveryoveregp","freedeliveryover"]));
  return s;
}
function sheetUrl(tab){
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(tab) + "&_=" + Date.now();
}
function getTab(tab){
  return fetch(sheetUrl(tab), {cache: "no-store", credentials: "omit"}).then(function(res){
    if (!res.ok) throw new Error("HTTP " + res.status + " on the " + tab + " tab");
    return res.text();
  }).then(function(text){
    if (/^\s*</.test(text)) throw new Error("Google sent a sign-in page instead of the " + tab + " tab, so the sheet isn't shared with Anyone with the link");
    return table(text);
  });
}
function finish(products, settings, hidden){
  DATA = {settings: settings, products: products};
  LOAD = "ready";
  cleanCart();
  if (WANT_ABOUT){ WANT_ABOUT = false; setTimeout(openAbout, 50); }
  setTimeout(openFromHash, 0);
  setTimeout(codeFromHash, 0);
  setTimeout(refreshMyCode, 1500);
  if (promoOn() && !promo.code){ var sp = loadJSON("miswak-promo", ""); if (sp) promo = {code: sp, pct: 0, ok: false, msg: ""}; }
  try {
    if (cart.length && !sessionStorage.getItem("miswak-back")){
      setTimeout(function(){ toast(t("welcomeBack", {n: count()}), true); }, 1800);
    }
    sessionStorage.setItem("miswak-back", "1");
  } catch(e){}
  if (CHECK) LOAD_INFO = PREVIEW ? "" : products.length + " products on the site" + (hidden ? ", " + hidden + " hidden or blank rows skipped" : "") + ". Loaded at " + new Date().toLocaleTimeString() + ".";
  renderShell();
}
function load(){
  LOAD = "loading"; LOAD_INFO = "";
  if (PREVIEW){
    var d = SAMPLE || {products: [], settings: {}};
    finish(d.products || [], Object.assign({}, DEFAULT_SETTINGS, d.settings || {}), 0);
    return;
  }
  renderShell();
  Promise.all([getTab("Products"), getTab("Settings").catch(function(){ return []; })]).then(function(res){
    var seen = {}, rows = res[0], products = [];
    rows.forEach(function(r, i){ var p = toProduct(r, i, seen); if (p) products.push(p); });
    finish(products, toSettings(res[1]), rows.length - products.length);
  }).catch(function(err){
    LOAD = "error";
    LOAD_INFO = (err && err.message) || "The sheet couldn't be reached";
    renderShell();
  });
}
function checkBar(){
  var bad = LOAD === "error", msg;
  if (PREVIEW) msg = "Live check: this is the Claude preview, so it shows sample products. The real website reads your Google Sheet.";
  else if (LOAD === "loading") msg = "Live check: reading your Google Sheet…";
  else if (bad) msg = "Live check: couldn't read your Google Sheet. " + LOAD_INFO + ". In Google Sheets, tap Share, set General access to “Anyone with the link” as Viewer, then reload this page.";
  else msg = "Live check: connected to your Google Sheet. " + LOAD_INFO;
  msg += " · Build " + BUILD + " · Samsung Internet: " + (IS_SAMSUNG ? "yes" : "no");
  return '<div class="check-bar' + (bad ? " bad" : "") + '" lang="en" dir="ltr" role="status"><div class="wrap">' + esc(msg) + "</div></div>";
}

/* ---------- logo: full strength above the headline, fades into the background as you scroll ---------- */
var markTick = false;
function placeMark(){
  markTick = false;
  var box = document.querySelector(".bgmark"), img = box && box.querySelector("img"), slot = document.querySelector(".logo-slot");
  if (!img || !slot || !img.offsetWidth) return;
  var vh = window.innerHeight, r = slot.getBoundingClientRect();
  var sy = window.scrollY || 0;
  var p = Math.min(1, Math.max(0, sy / Math.max(180, vh * 0.3)));
  var e = p * p * (3 - 2 * p);
  var q = Math.min(1, Math.max(0, sy / 60)), f = 1 - (1 - q) * (1 - q);
  var vw = box.clientWidth || window.innerWidth;
  var y = (r.top + r.height / 2) * (1 - e) + (vh / 2) * e - vh / 2;
  var x = ((r.left + r.width / 2) - vw / 2) * (1 - e);
  var s0 = r.width / img.offsetWidth, sc = s0 + (1 - s0) * e;
  var dim = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mark-dim")) || 1;
  img.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
  img.style.filter = "brightness(" + (1 - (1 - dim) * f).toFixed(3) + ")";
  box.style.opacity = (1 - 0.9 * f).toFixed(3);
}
function queueMark(){ if (!markTick){ markTick = true; requestAnimationFrame(placeMark); } }
window.addEventListener("scroll", queueMark, {passive: true});
window.addEventListener("resize", queueMark);

/* language switch: the page swooshes out one way and the new language slides in from the other */
var swapping = false;
function switchLang(){
  var next = lang === "ar" ? "en" : "ar";
  function apply(){ lang = next; try { localStorage.setItem("miswak-lang", lang); } catch(err){} }
  function parts(){ return Array.prototype.slice.call(document.querySelectorAll(".top .wrap, main, footer")); }
  if (CALM || swapping){ if (!swapping){ apply(); renderShell(); } return; }
  swapping = true;
  var dir = next === "ar" ? 1 : -1, y = window.scrollY || 0;
  parts().forEach(function(el){
    el.style.transition = "transform .24s cubic-bezier(.4,0,1,1), opacity .2s ease";
    el.style.transform = "translateX(" + (dir * 56) + "px)"; el.style.opacity = "0";
  });
  setTimeout(function(){
    apply(); renderShell(); window.scrollTo(0, y);
    var els = parts();
    els.forEach(function(el){ el.style.transition = "none"; el.style.transform = "translateX(" + (-dir * 56) + "px)"; el.style.opacity = "0"; });
    void document.body.offsetWidth;
    els.forEach(function(el){
      el.style.transition = "transform .5s cubic-bezier(.2,.8,.2,1), opacity .38s ease";
      el.style.transform = ""; el.style.opacity = "";
    });
    setTimeout(function(){ els.forEach(function(el){ el.style.transition = ""; }); swapping = false; }, 520);
  }, 240);
}
/* floating WhatsApp button: tap to chat, fling it away to hide until the next visit */
var fabGone = false;
function fabTip(){
  var f = $("#fab"); if (!f || f.classList.contains("drag")) return;
  f.classList.remove("tip"); void f.offsetWidth; f.classList.add("tip");
}
setTimeout(fabTip, 2200);
setInterval(fabTip, 60000);
function initFab(){
  var f = $("#fab"); document.body.classList.toggle("has-fab", !!f);
  if (!f) return;
  if (swapping) f.classList.add("ready");
  var sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false;
  f.addEventListener("dragstart", function(e){ e.preventDefault(); });
  f.addEventListener("animationend", function(e){ if (e.animationName === "fabIn") f.classList.add("ready"); });
  f.addEventListener("pointerdown", function(e){
    if (e.button > 0) return;
    down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    try { f.setPointerCapture(e.pointerId); } catch(err){}
  });
  f.addEventListener("pointermove", function(e){
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) > 8){ moved = true; f.classList.add("drag"); }
    if (moved){ f.style.transform = "translate(" + dx + "px," + dy + "px)"; f.style.opacity = Math.max(.35, 1 - Math.hypot(dx, dy) / 240); }
  });
  function end(){
    if (!down) return; down = false; f.classList.remove("drag");
    var d = Math.hypot(dx, dy);
    if (moved && d > 60){
      fabGone = true;
      var ux = dx / d, uy = dy / d;
      f.classList.add("gone");
      f.style.transform = "translate(" + (dx + ux * 320) + "px," + (dy + uy * 320) + "px) scale(.6)";
      f.style.opacity = "0";
      setTimeout(function(){ f.remove(); document.body.classList.remove("has-fab"); }, 360);
    } else { f.style.transform = ""; f.style.opacity = ""; }
  }
  f.addEventListener("pointerup", end);
  f.addEventListener("pointercancel", end);
  f.addEventListener("click", function(e){ if (moved){ e.preventDefault(); moved = false; } });
}
/* animated closing for every pop-up */
(function(){
  var P = window.HTMLDialogElement && HTMLDialogElement.prototype; if (!P) return;
  var nClose = P.close, nShow = P.showModal;
  P.close = function(v){
    var d = this;
    if (!d.open || CALM) return nClose.call(d, v);
    if (d._closing) return;
    d.classList.add("closing");
    d._closing = setTimeout(function(){ d._closing = 0; d.classList.remove("closing"); nClose.call(d, v); }, 240);
  };
  P.showModal = function(){
    if (this._closing){ clearTimeout(this._closing); this._closing = 0; this.classList.remove("closing"); return; }
    return nShow.apply(this, arguments);
  };
  document.addEventListener("cancel", function(e){
    var d = e.target; if (d && d.tagName === "DIALOG" && !CALM){ e.preventDefault(); d.close(); }
  }, true);
})();
/* lets phones show the pressed state */
document.addEventListener("touchstart", function(){}, {passive: true});

var WANT_ABOUT = /^#(about|contact)$/.test(location.hash || "");
load();
