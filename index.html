/* Layout: supply catalogue — sticky header with search, scrollable category rail, dense 2-up product grid; the cart opens as a side sheet; products come from a Google Sheet */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E5ECE8; --ink:#16201D; --muted:#55645E; --line:#D3DCD7;
  --accent:#2C5C3C; --accent-hover:#224A30; --accent-ink:#FFFFFF; --accent-soft:#E1EDE3; --wood:#8A5F35;

  --c-resto:#A3264B; --c-endo:#1D6A86; --c-bur:#4E54A6; --c-imp:#257564; --c-disp:#80611A; --c-kit:#72388D;
  /* physical colours: product photo ground, shade tabs, ISO file handles, bur grit rings (same in both themes) */
  --photo-bg:#FFFFFF;
  --sh-A1:#F3E8D3; --sh-A2:#EEDDBE; --sh-A3:#E6D0A6; --sh-A35:#DCC292; --sh-A4:#CEAF7C;
  --sh-B1:#F6EEDC; --sh-B2:#ECDFBF; --sh-B3:#E1CD9E; --sh-C1:#E4DBC6; --sh-C2:#D8CCB0; --sh-D2:#E2D6BF;
  --tab-edge:rgba(70,52,28,.28); --tab-shade:rgba(120,88,40,.2);
  --iso-15:#FFFFFF; --iso-20:#F2C230; --iso-25:#D2332E; --iso-30:#2457B8; --iso-35:#2E8B4A; --iso-40:#1C1C1C;
  --grit-c:#2E8B4A; --grit-m:#2457B8; --grit-f:#D2332E;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-arabic:"Reem Kufi","Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
  --f-arabic-text:"Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,serif;
  --f-label:var(--f-mono);
  --radius:12px;
}

    color-scheme:dark;
  }
}

*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}

/* sample notice */
.notice{background:var(--accent-soft);font-size:13.5px}
.notice .wrap{padding-block:8px}
.notice b{font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;flex:none;margin-inline-end:auto}
.brand .ico{width:30px;height:30px;color:var(--accent)}
.mark .stick{stroke:var(--wood)}
.brand .wm{font:800 20px/1 var(--f-display);letter-spacing:-.02em}
.brand .alt{font:600 15px/1 var(--f-arabic);color:var(--wood);margin-inline-start:7px}
:root[lang="ar"] .brand .wm{font:600 23px/1 var(--f-arabic)}
:root[lang="ar"] .brand .alt{font:700 13px/1 "Schibsted Grotesk",Arial,sans-serif}
.brand small{display:block;font:500 10px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
:root[lang="ar"] .brand small{font-size:11.5px;margin-top:5px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding-inline:38px 14px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.hbtn{flex:none;height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.hbtn .ico{width:18px;height:18px}
.lang-btn[lang="ar"]{font-family:var(--f-arabic-text);font-size:15px}
.lang-btn[lang="en"]{font-family:"Source Sans 3",Arial,sans-serif}
.cart-btn{border:0;background:var(--ink);color:var(--bg);padding:0 11px 0 13px}
.cart-btn .count{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:600 12px/22px var(--f-mono);text-align:center;padding:0 6px}
.cart-btn.bump .count{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:640px){.search{order:5;flex-basis:100%}}
@media (max-width:440px){.brand small,.hbtn .lbl{display:none}.hbtn{padding:0 11px}}
@media (max-width:360px){.brand .alt{display:none}}

/* hero */
.hero .wrap{display:grid;gap:22px;padding-block:26px 6px}
.hero h1{font:800 clamp(30px,7vw,52px)/1.06 var(--f-display);letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
:root[lang="ar"] .hero h1{font-weight:700;line-height:1.45;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:12px 0 0;color:var(--muted);font-size:17px;max-width:52ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:16px 0 0;font:500 12px var(--f-label);letter-spacing:.04em;text-transform:uppercase}
:root[lang="ar"] .facts{font-size:14px;font-weight:600}
.facts li{display:flex;align-items:center;gap:7px}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.guide-box{align-self:end}
.guide{display:flex;gap:5px;align-items:flex-start;direction:ltr}
.gt{flex:1 1 0;max-width:38px;display:flex;flex-direction:column;align-items:center;gap:5px}
.gt i{display:block;width:100%;aspect-ratio:3/5;border-radius:5px 5px 45% 45%/5px 5px 30% 30%;background:var(--c);box-shadow:inset 0 -7px 10px var(--tab-shade),inset 0 0 0 1px var(--tab-edge)}
.gt b{font:500 10.5px var(--f-mono);color:var(--muted)}
.gt.off i{opacity:.32}
.gt.off b{opacity:.55}
.guide-cap{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.guide-cap strong{color:var(--ink);font-weight:600}
@media (min-width:820px){.hero .wrap{grid-template-columns:1.25fr 1fr;align-items:end;padding-block:44px 10px}}

/* categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:18px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip small{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.list-head h2{font:700 20px var(--f-display);letter-spacing:-.01em;margin:0;min-width:0}
.list-head span{font:500 12px var(--f-label);color:var(--muted);flex:none}
:root[lang="ar"] .list-head span{font-size:13.5px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;padding-bottom:36px}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:4/3;width:100%;max-width:100%;border:0;background:var(--sunk);cursor:pointer;color:var(--cat);padding:0;overflow:hidden}
.tile.photo{background:var(--photo-bg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-width:100%;z-index:1;background:var(--photo-bg)}
.tile .ico{width:46px;height:46px;stroke-width:1.3}
.tile .sku,.tile .tag{z-index:2}
.tile .sku{position:absolute;inset-inline-start:8px;top:7px;font:500 10.5px var(--f-mono);letter-spacing:.04em;color:var(--muted);direction:ltr}
.tile.photo .sku{background:var(--surface);border-radius:6px;padding:1px 6px}
.tile .tag{position:absolute;inset-inline-end:8px;top:7px;font-weight:700;font-size:11.5px;background:var(--surface);color:var(--cat);border-radius:999px;padding:1px 8px;box-shadow:0 0 0 1px var(--line)}
.vis{position:absolute;left:8px;right:8px;bottom:9px;display:flex;gap:4px;justify-content:center;align-items:flex-end;direction:ltr}
.mt{width:11px;height:17px;border-radius:2px 2px 6px 6px;background:var(--c);box-shadow:inset 0 0 0 1px var(--tab-edge)}
.iso{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.grit{width:16px;height:6px;border-radius:3px;background:var(--c)}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pname{font:700 15px/1.3 var(--f-display);margin:0;letter-spacing:-.005em}
.spec{font-size:13.5px;line-height:1.4;color:var(--muted);margin:0}
.stock{font-weight:700;font-size:12.5px;margin-top:3px}
.stock.in{color:var(--ok)}
.stock.low{color:var(--warn)}
.stock.out{color:var(--danger)}
.buy{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{font:700 17px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font:500 11px var(--f-label);color:var(--muted);margin-inline-start:3px}
.add{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer}
.add:hover{background:var(--accent-hover)}
.add.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.add.alt:hover{background:var(--accent-soft)}
.add:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.empty-list{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--muted)}

/* how it works */
.how{border-top:1px solid var(--line)}
.how .wrap{padding-block:30px}
.how h2{font:700 20px var(--f-display);margin:0 0 16px}
.how ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;list-style:none;padding:0;margin:0;counter-reset:s}
.how li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.how li::before{content:counter(s);font:800 26px/1 var(--f-display);color:var(--accent);grid-row:span 2}
.how b{font-weight:700}
.how li span{color:var(--muted);font-size:15px;grid-column:2}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

function pickLang(){
  var h = (location.hash || "").slice(1);
  if (h === "ar" || h === "en") return h;
  try { var s = localStorage.getItem("miswak-lang"); if (s === "ar" || s === "en") return s; } catch(e){}
  return (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
}
function t(k, vars){
  var s = T[lang][k]; if (s == null) s = T.en[k]; if (s == null) s = k;
  if (vars) for (var v in vars) s = s.split("{" + v + "}").join(vars[v]);
  return s;
}
function L(o){ return o ? (o[lang] || o.en || o.ar || "") : ""; }
function money(n){ return Number(n || 0).toLocaleString("en-US") + " " + t("cur"); }
function byId(id){ for (var i = 0; i < DATA.products.length; i++) if (DATA.products[i].id === id) return DATA.products[i]; return null; }
function catOf(id){ for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i]; return CATS[0]; }
function catColor(c){ return "var(--c-" + (ICONS[c] ? c : "kit") + ")"; }
function optText(p, v){
  if (!p.opt) return v;

}

function cartQty(id, exceptKey){ var n = 0; cart.forEach(function(i){ if (i.id === id && i.key !== exceptKey) n += i.qty; }); return n; }
function cleanCart(){
  cart = (Array.isArray(cart) ? cart : []).filter(function(i){ return i && byId(i.id) && i.qty > 0; });
  cart.forEach(function(i){ var p = byId(i.id); var room = Math.max(0, p.stock - cartQty(i.id, i.key)); i.qty = Math.min(i.qty, room); });
  cart = cart.filter(function(i){ return i.qty > 0; });
  saveJSON("miswak-cart", cart);
}

function visual(p){
  if (p.opt && p.opt.style === "shade") return '<span class="vis">' + p.opt.values.filter(function(v){ return SHADE_VAR[v]; }).map(function(v){ return '<span class="mt" style="--c:var(' + SHADE_VAR[v] + ')"></span>'; }).join("") + "</span>";
  if (p.iso) return '<span class="vis">' + ISO.map(function(s){ return '<span class="iso" style="--c:var(--iso-' + s + ')"></span>'; }).join("") + "</span>";
  if (p.grit) return '<span class="vis"><span class="grit" style="--c:var(--grit-c)"></span><span class="grit" style="--c:var(--grit-m)"></span><span class="grit" style="--c:var(--grit-f)"></span></span>';
  return "";
}
function tileInner(p){
  var tag = L(p.tag);
  return '<span class="sku">' + esc(p.sku) + "</span>" + (tag ? '<span class="tag">' + esc(tag) + "</span>" : "") +
    icon(ICONS[p.cat] || ICONS.kit) + visual(p) +
    (p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove(\'photo\');this.remove()">' : "");
}
function stockHtml(p, long){
  if (p.stock <= 0) return '<span class="stock out">' + t("stockOut") + "</span>";
  if (p.stock <= LOW) return '<span class="stock low">' + t("stockLow", {n: p.stock}) + "</span>";
  return '<span class="stock in">' + t("stockN", {n: p.stock}) + "</span>";
}
function matches(p){
  if (cat !== "all" && p.cat !== cat) return false;
  if (!query) return true;
  var c = catOf(p.cat);
  var hay = [p.name.en, p.name.ar, p.spec.en, p.spec.ar, p.sku, p.desc.en, p.desc.ar, c.en, c.ar].join(" ").toLowerCase();
  return query.split(/\s+/).every(function(w){ return hay.indexOf(w) > -1; });
}
function renderCats(){
  $("#cats").innerHTML = CATS.map(function(c){
    var n = c.id === "all" ? DATA.products.length : DATA.products.filter(function(p){ return p.cat === c.id; }).length;
    if (c.id !== "all" && !n) return "";
    return '<button class="chip" type="button" data-cat="' + c.id + '" aria-pressed="' + (c.id === cat) + '">' + L(c) + " <small>" + n + "</small></button>";
  }).join("");
}
function card(p){
  var out = p.stock <= 0, choose = !!(p.opt && p.opt.values && p.opt.values.length);
  return '<article class="card" style="--cat:' + catColor(p.cat) + '">' +
    '<button class="tile' + (p.img ? " photo" : "") + '" type="button" data-open="' + p.id + '" aria-label="' + esc(t("view", {name: L(p.name)})) + '">' + tileInner(p) + "</button>" +
    '<div class="card-body"><h3 class="pname">' + esc(L(p.name)) + '</h3><p class="spec">' + esc(L(p.spec)) + "</p>" + stockHtml(p) +
      '<div class="buy"><span class="price">' + Number(p.price).toLocaleString("en-US") + "<small>" + t("cur") + "</small></span>" +
      '<button class="add' + (choose ? " alt" : "") + '" type="button" data-' + (choose ? "open" : "add") + '="' + p.id + '"' + (out ? " disabled" : "") + ">" +
      (out ? t("soldOut") : choose ? t("choose") : t("add")) + "</button></div></div></article>";
}
function renderGrid(){
  if (LOAD !== "ready"){
    $("#listTitle").textContent = L(catOf("all"));
    $("#listCount").textContent = "";
    $("#grid").innerHTML = LOAD === "loading"
      ? new Array(6).join(".").split(".").map(function(){ return '<div class="skel" aria-hidden="true"><i></i><b></b><b></b></div>'; }).join("") + '<span class="sr" role="status">' + esc(t("loading")) + "</span>"
      : '<div class="load-err" role="alert"><b>' + esc(t("loadErrTitle")) + "</b><span>" + esc(t("loadErrText")) + '</span><button class="btn sm" type="button" data-act="retry">' + esc(t("retry")) + "</button></div>";
    return;
  }
  var list = DATA.products.filter(matches);
  $("#listTitle").textContent = query ? t("resultsFor", {q: query}) : L(catOf(cat));
  $("#listCount").textContent = list.length === 1 ? t("count1") : t("count", {n: list.length});
  $("#grid").innerHTML = list.length ? list.map(card).join("") : '<p class="empty-list">' + esc(t("noMatch", {q: query})) + "</p>";
}

/* ---------- cart ---------- */
function count(){ return cart.reduce(function(n, i){ return n + i.qty; }, 0); }
function subtotal(){ return cart.reduce(function(n, i){ return n + byId(i.id).price * i.qty; }, 0); }
function updateCount(bump){
  var n = count(), b = $("#cartBtn");
  $("#cartCount").textContent = n;
  b.setAttribute("aria-label", t("cartAria", {n: n}));
  if (bump){ b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
function saveCart(){ saveJSON("miswak-cart", cart); }
function addToCart(id, opt, qty){
  var p = byId(id); if (!p) return;
  var room = Math.max(0, p.stock - cartQty(id));
  if (room <= 0){ toast(t("maxStock", {n: p.stock}), true); return; }
  var n = Math.min(qty, room), key = id + "|" + (opt || "");
  var hit = cart.filter(function(i){ return i.key === key; })[0];
  if (hit) hit.qty += n; else cart.push({key: key, id: id, opt: opt || "", qty: n});
  saveCart(); updateCount(true);
  toast(n < qty ? t("maxStock", {n: p.stock}) : t("added", {name: L(p.name) + (opt ? ", " + optText(p, opt) : "")}), true);
}
var toastTimer;
function toast(msg, withCart){
  var el = $("#toast");
  el.innerHTML = esc(msg) + (withCart ? " · <u>" + esc(t("viewCart")) + "</u>" : "");
  el.dataset.cart = withCart ? "1" : "";
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 3200);
}

/* ---------- product sheet ---------- */
function openProduct(id){
  var p = byId(id); if (!p) return;
  var sheet = $("#productSheet"), body = $("#productBody");
  var hasOpt = !!(p.opt && p.opt.values && p.opt.values.length);
  var sel = hasOpt ? p.opt.values[Math.min(p.opt.def || 0, p.opt.values.length - 1)] : "";
  var qty = 1;
  function room(){ return Math.max(0, p.stock - cartQty(p.id)); }
  function optHtml(){
    if (!hasOpt) return "";
    var shade = p.opt.style === "shade";
    var btns = p.opt.values.map(function(v){
      var on = v === sel;
      if (shade && SHADE_VAR[v]) return '<button type="button" class="shade-opt" data-v="' + esc(v) + '" aria-pressed="' + on + '" style="--c:var(' + SHADE_VAR[v] + ')"><i></i><b>' + esc(v) + "</b></button>";
      var sw = p.opt.swatch && p.opt.swatch[v] ? '<span class="sw" style="--c:var(' + p.opt.swatch[v] + ')"></span>' : "";
      return '<button type="button" class="chip" data-v="' + esc(v) + '" aria-pressed="' + on + '">' + sw + esc(optText(p, v)) + "</button>";
    }).join("");
    return '<div><p class="opt-label">' + esc(L(p.opt.label)) + ": " + esc(optText(p, sel)) + '</p><div class="opts" role="group" aria-label="' + esc(L(p.opt.label)) + '">' + btns + "</div></div>";
  }
  function render(){
    var r = room(), out = p.stock <= 0;
    if (qty > r) qty = Math.max(1, r);
    var blocked = out || r <= 0;
    body.innerHTML =
      '<div class="sheet-top"><span class="sku"><bdi class="ltr">' + esc(p.sku) + "</bdi> · " + esc(L(catOf(p.cat))) + '</span><button class="x" type="button" data-close aria-label="' + esc(t("close")) + '">' + icon(I_CLOSE) + "</button></div>" +
      '<div class="tile' + (p.img ? " photo" : "") + '" style="--cat:' + catColor(p.cat) + '">' + tileInner(p) + "</div>" +
      '<div><h3 id="pTitle">' + esc(L(p.name)) + '</h3><p class="spec">' + esc(L(p.spec)) + "</p>" + stockHtml(p) + "</div>" +
      (L(p.desc) ? '<p class="desc">' + esc(L(p.desc)) + "</p>" : "") + optHtml() +
      (!out && r <= 0 ? '<p class="note warn">' + esc(t("allInCart", {n: p.stock})) + "</p>" : "") +
      '<div class="sheet-buy"><div class="qty"><button type="button" data-q="-1" aria-label="' + esc(t("dec")) + '"' + (qty <= 1 || blocked ? " disabled" : "") + ">−</button><output aria-live=\"polite\">" + qty + '</output><button type="button" data-q="1" aria-label="' + esc(t("inc")) + '"' + (qty >= r || blocked ? " disabled" : "") + ">+</button></div>" +
      '<button class="btn" type="button" data-buy' + (blocked ? " disabled" : "") + ">" + (out ? t("soldOut") : t("addToCart", {t: money(p.price * qty)})) + "</button></div>";
  }
  render();
  body.onclick = function(e){
    var v = e.target.closest("[data-v]");
    if (v){ sel = v.dataset.v; render(); return; }
    var q = e.target.closest("[data-q]");
    if (q){ qty = Math.max(1, Math.min(room(), qty + Number(q.dataset.q))); render(); return; }
    if (e.target.closest("[data-buy]")){ sheet.close(); addToCart(p.id, sel, qty); return; }
    if (e.target.closest("[data-close]")) sheet.close();
  };
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
}

/* ---------- cart sheet: cart → details → done ---------- */
function openCart(v){
  view = v || (lastOrder && !cart.length ? "done" : "cart");
  renderSheet();
  var d = $("#cartSheet"); if (!d.open) d.showModal();
}
function renderSheet(){
  $("#cartBack").hidden = view !== "details";
  if (view === "cart") renderCartView(); else if (view === "details") renderDetails(); else renderDone();
  $("#cartBody").scrollTop = 0;
}
function renderCartView(){
  $("#cartTitle").textContent = t("yourCart");
  if (!cart.length){
    $("#cartBody").innerHTML = '<div class="empty">' + icon(I_CART) + "<b>" + t("emptyTitle") + "</b><span>" + t("emptyText") + "</span></div>";
    $("#cartFoot").innerHTML = '<button class="btn ghost" type="button" data-act="closecart">' + t("browse") + "</button>";
    return;
  }
  $("#cartBody").innerHTML = cart.map(function(i, idx){
    var p = byId(i.id), full = cartQty(i.id) >= p.stock;
    return '<div class="line"><div><h4>' + esc(L(p.name)) + '</h4><div class="meta">' + (i.opt ? esc(L(p.opt.label) + ": " + optText(p, i.opt)) + " · " : "") + esc(t("each", {p: money(p.price)})) + "</div></div>" +
      '<div class="lt">' + money(p.price * i.qty) + "</div>" +
      '<div class="ctl"><div class="qty sm"><button type="button" data-line="' + idx + '" data-d="-1" aria-label="' + esc(t("dec")) + '">−</button><output>' + i.qty + '</output><button type="button" data-line="' + idx + '" data-d="1" aria-label="' + esc(t("inc")) + '"' + (full ? " disabled" : "") + ">+</button></div>" +
      '<button class="link" type="button" data-remove="' + idx + '">' + t("remove") + "</button></div></div>";
  }).join("");
  $("#cartFoot").innerHTML = '<div class="totals"><div class="row total"><span>' + t("subtotal") + "</span><span>" + money(subtotal()) + "</span></div></div>" +
    '<p class="hint">' + t("deliveryNext") + "</p>" +
    '<button class="btn" type="button" data-act="details">' + t("toDetails") + "</button>";
}
function field(id, label, control, hint){
  return '<div class="field"><label for="' + id + '">' + label + "</label>" + control + (hint ? '<p class="hint">' + hint + "</p>" : "") + '<p class="err" id="' + id + '-err" hidden></p></div>';
}
function seg(name, labels, cur){
  return '<div class="seg">' + labels.map(function(l, i){ return '<label class="pick"><input type="radio" name="' + name + '" value="' + i + '"' + (String(cur) === String(i) ? " checked" : "") + "><span>" + l + "</span></label>"; }).join("") + "</div>";
}
function renderDetails(){
  $("#cartTitle").textContent = t("details");
  var d = cust, govs = ZONES.reduce(function(a, z){ return a.concat(z.govs); }, []).sort(function(a, b){ return govName(a).localeCompare(govName(b), lang); });
  $("#cartBody").innerHTML =
    '<form id="orderForm" novalidate>' +
    field("name", t("fName"), '<input id="name" name="name" autocomplete="name" value="' + esc(d.name || "") + '">') +
    field("phone", t("fPhone"), '<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="01X XXXX XXXX" value="' + esc(d.phone || "") + '">', t("phoneHint")) +
    '<fieldset><legend class="legend">' + t("iam") + "</legend>" + seg("type", T[lang].types, d.type == null ? 0 : d.type) + "</fieldset>" +
    '<div class="two">' +
      field("gov", t("fGov"), '<select id="gov" name="gov"><option value="">' + t("chooseOpt") + "</option>" + govs.map(function(g){ return '<option value="' + g + '"' + (d.gov === g ? " selected" : "") + ">" + govName(g) + "</option>"; }).join("") + "</select>") +
      field("area", t("fArea"), '<input id="area" name="area" autocomplete="address-level2" value="' + esc(d.area || "") + '">') +
    "</div>" +
    field("address", t("fAddress"), '<textarea id="address" name="address" autocomplete="street-address" rows="2">' + esc(d.address || "") + "</textarea>") +
    '<fieldset><legend class="legend">' + t("fPay") + "</legend>" + seg("pay", T[lang].pays, d.pay == null ? 0 : d.pay) + "</fieldset>" +
    field("notes", t("fNotes") + ' <span class="opt-txt">' + t("optional") + "</span>", '<textarea id="notes" name="notes" rows="2" placeholder="' + esc(t("notesPh")) + '">' + esc(d.notes || "") + "</textarea>") +
    '<div class="summary totals" id="sumBox"></div></form>';
  $("#cartFoot").innerHTML = '<button class="btn" type="submit" form="orderForm" id="placeBtn"></button>';
  updateSummary();
}
function readForm(){
  var f = $("#orderForm"); if (!f) return cust;
  var o = {}; new FormData(f).forEach(function(v, k){ o[k] = String(v).trim(); });
  return o;
}
function onDetailsInput(e){
  if (!e.target.closest || !e.target.closest("#orderForm")) return;
  cust = readForm(); saveJSON("miswak-details", cust); updateSummary();
}
function totals(gov){
  var sub = subtotal(), z = zoneIndex(gov), fee = z > -1 ? Number(DATA.settings.fees[z] || 0) : 0;
  return {sub: sub, z: z, fee: fee, total: sub + fee};
}
function updateSummary(){
  var tt = totals(cust.gov), n = count();
  $("#sumBox").innerHTML =
    '<div class="row"><span>' + (n === 1 ? t("subItems1") : t("subItems", {n: n})) + "</span><span>" + money(tt.sub) + "</span></div>" +
    '<div class="row"><span>' + t("delivery") + (tt.z > -1 ? " · " + L(ZONES[tt.z]) : "") + "</span><span>" + (tt.z > -1 ? money(tt.fee) : t("chooseGov")) + "</span></div>" +
    '<div class="row total"><span>' + t("total") + "</span><span>" + money(tt.total) + "</span></div>";
  $("#placeBtn").textContent = t("place", {t: money(tt.total)});
}
function setErr(id, msg){
  var el = document.getElementById(id), er = document.getElementById(id + "-err");
  if (!el || !er) return;
  el.setAttribute("aria-invalid", msg ? "true" : "false");
  er.textContent = msg || ""; er.hidden = !msg;
}
function placeOrder(){
  var d = readForm();
  var phone = (d.phone || "").replace(/[\s-]/g, "").replace(/^\+?20(?=1)/, "0");
  var errs = {
    name: d.name ? "" : t("errName"),
    phone: /^01[0125]\d{8}$/.test(phone) ? "" : t("errPhone"),
    gov: d.gov ? "" : t("errGov"),
    area: d.area ? "" : t("errArea"),
    address: d.address ? "" : t("errAddr")
  };
  var first = null;
  Object.keys(errs).forEach(function(k){ setErr(k, errs[k]); if (errs[k] && !first) first = k; });
  if (first){ document.getElementById(first).focus(); return; }
  var tt = totals(d.gov), now = new Date();
  var no = "MSW-" + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0") + "-" + Math.floor(100 + Math.random() * 900);
  var payIdx = Number(d.pay || 0), typeIdx = Number(d.type || 0);
  var lines = cart.map(function(i){ var p = byId(i.id); return "• " + i.qty + " × " + L(p.name) + (i.opt ? ", " + optText(p, i.opt) : "") + " (" + p.sku + ") — " + money(p.price * i.qty); });
  var text = [
    t("mNew", {no: no}), (lang === "ar" ? "مسواك لمستلزمات الأسنان" : "Miswak Dental Supply"), "",
    t("mName") + ": " + d.name, t("mPhone") + ": " + phone, t("mCust") + ": " + T[lang].types[typeIdx],
    t("mAddr") + ": " + d.address + "، ".replace("، ", lang === "ar" ? "، " : ", ") + d.area + (lang === "ar" ? "، " : ", ") + govName(d.gov), "",
    t("mItems") + ":"
  ].concat(lines, ["",
    t("subtotal") + ": " + money(tt.sub),
    t("delivery") + " (" + L(ZONES[tt.z]) + "): " + money(tt.fee),
    t("total") + ": " + money(tt.total),
    t("mPay") + ": " + T[lang].pays[payIdx]
  ]);
  if (d.notes) text.push(t("mNotes") + ": " + d.notes);
  lastOrder = {no: no, text: text.join("\n"), pay: payIdx, total: tt.total, lang: lang};
  cart = []; saveCart(); updateCount(false);
  view = "done"; renderSheet();
}
function renderDone(){
  var o = lastOrder, s = DATA.settings;
  $("#cartTitle").textContent = t("doneTitle");
  var wa = "https://wa.me/" + (s.whatsapp || "") + "?text=" + encodeURIComponent(o.text);
  var payNote = o.pay === 1 ? (s.instapay ? t("payInsta", {t: money(o.total), a: '<bdi class="ltr">' + esc(s.instapay) + "</bdi>"}) : t("payInstaLater")) : o.pay === 2 ? t("payWallet") : t("payCod", {t: money(o.total)});
  $("#cartBody").innerHTML = '<div class="done"><div class="done-mark">' + icon(I_CHECK) + "</div><h3>" + t("doneHead") + '</h3><p class="order-no ltr">' + o.no + "</p><p>" + t("doneBody") + " " + payNote + "</p>" +
    '<label class="legend" for="orderText">' + t("yourOrder") + '</label><textarea id="orderText" readonly dir="auto">' + esc(o.text) + '</textarea><p class="hint" id="copyNote" aria-live="polite"></p></div>';
  $("#cartFoot").innerHTML = '<a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">' + icon(I_WA) + t("sendWa") + "</a>" +
    '<button class="btn ghost" type="button" data-act="copy">' + t("copy") + "</button>" +
    '<button class="link" type="button" data-act="closecart" style="justify-self:center">' + t("keepShopping") + "</button>";
}
function copyOrder(){
  var ta = $("#orderText"), note = $("#copyNote");
  function fallback(){ ta.focus(); ta.select(); note.textContent = t("copyFallback"); }
  try { navigator.clipboard.writeText(lastOrder.text).then(function(){ note.textContent = t("copied"); }, fallback); } catch(e){ fallback(); }
}
function onCartClick(e){
  var cs = $("#cartSheet");
  if (e.target === cs){ cs.close(); return; }
  var line = e.target.closest("[data-line]");
  if (line){
    var idx = Number(line.dataset.line), i = cart[idx], p = byId(i.id), d = Number(line.dataset.d);
    if (d > 0 && cartQty(i.id) >= p.stock) return;
    i.qty += d; if (i.qty < 1) cart.splice(idx, 1);
    saveCart(); updateCount(false); renderCartView(); return;
  }
  var rm = e.target.closest("[data-remove]");
  if (rm){ cart.splice(Number(rm.dataset.remove), 1); saveCart(); updateCount(false); renderCartView(); return; }
}

/* ---------- global clicks ---------- */
document.addEventListener("click", function(e){
  var a = e.target.closest("[data-act]");
  if (a){
    var act = a.dataset.act;
    if (act === "lang"){ lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("miswak-lang", lang); } catch(err){} renderShell(); return; }
    if (act === "cart"){ openCart(); return; }
    if (act === "toast"){ a.hidden = true; if (a.dataset.cart) openCart("cart"); return; }
    if (act === "retry"){ load(); return; }
    if (act === "closecart"){ $("#cartSheet").close(); return; }
    if (act === "backcart"){ view = "cart"; renderSheet(); return; }
    if (act === "details"){ view = "details"; renderSheet(); return; }
    if (act === "copy"){ copyOrder(); return; }
  }
  var c = e.target.closest("[data-cat]");
  if (c){ cat = c.dataset.cat; renderCats(); renderGrid(); return; }
  var o = e.target.closest("[data-open]");
  if (o && !o.closest("dialog")){ openProduct(o.dataset.open); return; }
  var ad = e.target.closest("[data-add]");
  if (ad){ addToCart(ad.dataset.add, "", 1); }
});

/* =================== LOADING THE CATALOGUE FROM GOOGLE SHEETS =================== */
var CAT_KEYS = {studentkits:"kit", kits:"kit", kit:"kit", restorative:"resto", resto:"resto", endodontics:"endo", endo:"endo", burs:"bur", bur:"bur", impression:"imp", imp:"imp", disposables:"disp", disp:"disp"};
var GRIT = {coarse:"--grit-c", medium:"--grit-m", fine:"--grit-f"};
function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function parseCSV(text){
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (q){
      if (c === '"'){ if (text.charAt(i + 1) === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function table(text){
  var rows = parseCSV(text);
  if (!rows.length) return [];
  var head = rows[0].map(norm);
  return rows.slice(1).map(function(r){ var o = {}; head.forEach(function(h, i){ if (h) o[h] = (r[i] || "").trim(); }); return o; });
}
function pick(o, keys){ for (var i = 0; i < keys.length; i++){ var v = o[keys[i]]; if (v != null && v !== "") return v; } return ""; }
function num(v){ var n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; }
function yes(v){ return /^(true|yes|y|1|x|نعم)$/i.test(String(v || "").trim()); }
function split(s){ return String(s || "").split(/[,،]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function photoUrl(s){
  s = String(s || "").trim(); if (!s) return "";
  if (/drive\.google\.com|docs\.google\.com/.test(s)){
    var m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/);
    return m ? "https://lh3.googleusercontent.com/d/" + m[1] + "=w900" : "";
  }
  return /^https:\/\//.test(s) ? s : "";
}
function toProduct(r, i, seen){
  var name = {en: pick(r, ["nameenglish","name"]), ar: pick(r, ["namearabic"])};
  if (!name.en && !name.ar) return null;
  if (yes(pick(r, ["hidefromsite","hide"]))) return null;
  var sku = pick(r, ["code","sku"]) || "ITEM-" + (i + 2);
  var id = sku; while (seen[id]) id += "-" + (i + 2); seen[id] = 1;
  var cat = CAT_KEYS[norm(pick(r, ["category"]))] || "other";
  var p = {id: id, sku: sku, cat: cat,
    price: num(pick(r, ["priceegp","price"])), stock: Math.max(0, Math.floor(num(pick(r, ["instock","stock"])))),
    name: name,
    spec: {en: pick(r, ["shortdetailsenglish","detailsenglish"]), ar: pick(r, ["shortdetailsarabic","detailsarabic"])},
    desc: {en: pick(r, ["descriptionenglish"]), ar: pick(r, ["descriptionarabic"])},
    tag: {en: pick(r, ["badgeenglish"]), ar: pick(r, ["badgearabic"])},
    opt: null, img: photoUrl(pick(r, ["photolink","photo"]))};
  var vals = split(pick(r, ["choicesenglish","choices"]));
  if (vals.length){
    var label = {en: pick(r, ["choicenameenglish"]), ar: pick(r, ["choicenamearabic"])};
    if (!label.en) label.en = label.ar || "Option";
    p.opt = {label: label, values: vals, values_ar: split(pick(r, ["choicesarabic"])), def: 0,
             style: vals.every(function(v){ return SHADE_VAR[v]; }) ? "shade" : "chip"};
    var sw = {}, any = false;
    vals.forEach(function(v){ if (GRIT[norm(v)]){ sw[v] = GRIT[norm(v)]; any = true; } });
    if (any){ p.opt.swatch = sw; p.grit = true; }
  }
  if (cat === "endo" && /\biso\b/i.test(p.spec.en)) p.iso = true;
  return p;
}
function toSettings(rows){
  var r = rows[0] || {}, s = Object.assign({}, DEFAULT_SETTINGS), fees = [];
  Object.keys(r).forEach(function(k){ if (k.indexOf("deliveryfee") === 0) fees.push(num(r[k])); });
  s.whatsapp = String(pick(r, ["whatsappnumber","whatsapp"])).replace(/\D/g, "");
  s.instapay = pick(r, ["instapayaddress","instapay"]);
  if (fees.length) s.fees = [0, 1, 2].map(function(i){ return fees[i] != null ? fees[i] : DEFAULT_SETTINGS.fees[i]; });
  s.notice = yes(pick(r, ["showpreviewbanner"]));
  return s;
}
function sheetUrl(tab){
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(tab) + "&_=" + Date.now();
}
function getTab(tab){
  return fetch(sheetUrl(tab), {cache: "no-store", credentials: "omit"}).then(function(res){
    if (!res.ok) throw new Error("HTTP " + res.status + " on the " + tab + " tab");
    return res.text();
  }).then(function(text){
    if (/^\s*</.test(text)) throw new Error("Google sent a sign-in page instead of the " + tab + " tab, so the sheet isn't shared with Anyone with the link");
    return table(text);
  });
}
function finish(products, settings, hidden){
  DATA = {settings: settings, products: products};
  LOAD = "ready";
  cleanCart();
  if (CHECK) LOAD_INFO = PREVIEW ? "" : products.length + " products on the site" + (hidden ? ", " + hidden + " hidden or blank rows skipped" : "") + ". Loaded at " + new Date().toLocaleTimeString() + ".";
  renderShell();
}
function load(){
  LOAD = "loading"; LOAD_INFO = "";
  if (PREVIEW){
    var d = SAMPLE || {products: [], settings: {}};
    finish(d.products || [], Object.assign({}, DEFAULT_SETTINGS, d.settings || {}), 0);
    return;
  }
  renderShell();
  Promise.all([getTab("Products"), getTab("Settings").catch(function(){ return []; })]).then(function(res){
    var seen = {}, rows = res[0], products = [];
    rows.forEach(function(r, i){ var p = toProduct(r, i, seen); if (p) products.push(p); });
    finish(products, toSettings(res[1]), rows.length - products.length);
  }).catch(function(err){
    LOAD = "error";
    LOAD_INFO = (err && err.message) || "The sheet couldn't be reached";
    renderShell();
  });
}
function checkBar(){
  var bad = LOAD === "error", msg;
  if (PREVIEW) msg = "Live check: this is the Claude preview, so it shows sample products. The real website reads your Google Sheet.";
  else if (LOAD === "loading") msg = "Live check: reading your Google Sheet…";
  else if (bad) msg = "Live check: couldn't read your Google Sheet. " + LOAD_INFO + ". In Google Sheets, tap Share, set General access to “Anyone with the link” as Viewer, then reload this page.";
  else msg = "Live check: connected to your Google Sheet. " + LOAD_INFO;
  return '<div class="check-bar' + (bad ? " bad" : "") + '" lang="en" dir="ltr" role="status"><div class="wrap">' + esc(msg) + "</div></div>";
}

/* ---------- start ---------- */
load();
})();
</script>
